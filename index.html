<!DOCTYPE html>
<html>
<head>
<title>BGMI UC Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#000;
padding:18px;
text-align:center;
font-size:25px;
font-weight:bold;
}

.banner img{
width:100%;
height:230px;
object-fit:cover;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.card{
background:#1e293b;
width:200px;
margin:10px;
padding:15px;
border-radius:15px;
text-align:center;
box-shadow:0 0 10px #000;
}

.card img{
width:120px;
height:120px;
object-fit:contain;
}

button{
background:#ff9800;
border:0;
padding:12px;
width:90%;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.box{
display:none;
background:#1e293b;
margin:20px;
padding:20px;
border-radius:10px;
text-align:center;
}

input{
padding:12px;
width:90%;
margin:5px;
border-radius:5px;
border:0;
}
</style>

</head>

<body>

<header>
🎮 BGMI UC STORE
</header>

<div class="banner">
<img src="banner.jpg">
</div>


<div class="container">

<div class="card">
<img src="uc.png">
<h2>8000 UC</h2>
<h3>₹1499</h3>
<button onclick="buy('8000 UC',1499)">BUY NOW</button>
</div>


<div class="card">
<img src="uc.png">
<h2>16000 UC</h2>
<h3>₹2800</h3>
<button onclick="buy('16000 UC',2800)">BUY NOW</button>
</div>


<div class="card">
<img src="uc.png">
<h2>24000 UC</h2>
<h3>₹4200</h3>
<button onclick="buy('24000 UC',4200)">BUY NOW</button>
</div>


<div class="card">
<img src="uc.png">
<h2>32000 UC</h2>
<h3>₹7000</h3>
<button onclick="buy('32000 UC',7000)">BUY NOW</button>
</div>


</div>


<div class="box" id="box">

<h2>Order Details</h2>

<input id="name" placeholder="Your Name">

<input id="uid" placeholder="BGMI UID">

<br><br>

<button onclick="order()">Confirm Order WhatsApp</button>

</div>


<script>

let pack="";
let price="";

function buy(p,a){

pack=p;
price=a;

document.getElementById("box").style.display="block";

}


function order(){

let name=document.getElementById("name").value;
let uid=document.getElementById("uid").value;


let msg=
"BGMI UC ORDER%0A"+
"Name: "+name+
"%0AUID: "+uid+
"%0APack: "+pack+
"%0APrice: ₹"+price;


window.open("https://wa.me/918949220131?text="+msg);

}

</script>


</body>
</html>
