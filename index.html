<!DOCTYPE html>
<html>
<head>

<title>BGMI UC Store</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

header{
background:black;
padding:15px;
text-align:center;
font-size:25px;
font-weight:bold;
}

.banner{
width:100%;
background:black;
}

.banner img{
width:100%;
height:auto;
display:block;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:10px;
}

.card{
background:#1e293b;
width:200px;
margin:10px;
padding:15px;
border-radius:15px;
text-align:center;
}

.card img{
width:130px;
height:130px;
object-fit:contain;
border-radius:10px;
}

button{
background:#ff9800;
color:black;
border:0;
padding:12px;
width:90%;
border-radius:8px;
font-weight:bold;
cursor:pointer;
margin:5px;
}

.payment-btn{
background:#00c853;
color:white;
}

.whatsapp-btn{
background:#25D366;
color:white;
}

.box{
display:none;
background:#1e293b;
margin:20px auto;
padding:20px;
border-radius:10px;
text-align:center;
max-width:450px;
width:90%;
}

input{
width:90%;
padding:12px;
margin:7px;
border-radius:5px;
border:none;
box-sizing:border-box;
font-size:16px;
}

.selected{
background:#0f172a;
padding:12px;
border-radius:8px;
margin-bottom:15px;
}

</style>

</head>


<body>


<header>
🎮 BGMI UC STORE
</header>


<!-- BANNER -->

<div class="banner">

<img src="banner.jpg" alt="BGMI Banner">

</div>


<!-- UC PACKAGES -->

<div class="container">


<div class="card">

<img src="uc.jpg" alt="UC">

<h2>8000 UC</h2>

<p>₹1499</p>

<button onclick="buy('8000 UC',1499)">
BUY NOW
</button>

</div>


<div class="card">

<img src="uc.jpg" alt="UC">

<h2>16000 UC</h2>

<p>₹2800</p>

<button onclick="buy('16000 UC',2800)">
BUY NOW
</button>

</div>


<div class="card">

<img src="uc.jpg" alt="UC">

<h2>24000 UC</h2>

<p>₹4200</p>

<button onclick="buy('24000 UC',4200)">
BUY NOW
</button>

</div>


<div class="card">

<img src="uc.jpg" alt="UC">

<h2>32000 UC</h2>

<p>₹7000</p>

<button onclick="buy('32000 UC',7000)">
BUY NOW
</button>

</div>


</div>


<!-- ORDER DETAILS -->

<div class="box" id="box">

<h2>📦 Order Details</h2>

<div class="selected">

<p id="selectedPack"></p>

</div>


<input
id="name"
placeholder="Enter Your Name"
>


<input
id="uid"
placeholder="Enter BGMI UID"
>


<br>


<!-- PAYMENT BUTTON -->

<button
class="payment-btn"
onclick="makePayment()"
>
💳 PAY NOW
</button>


<!-- WHATSAPP ORDER BUTTON -->

<button
class="whatsapp-btn"
onclick="sendWhatsApp()"
>
📱 WHATSAPP ORDER
</button>


</div>


<script>


let pack = "";

let price = "";



/* BUY NOW */

function buy(p,a){

pack = p;

price = a;


/* Show Order Box */

document.getElementById("box").style.display = "block";


/* Show Selected Package */

document.getElementById("selectedPack").innerText =
"Selected: " + pack +
" | Price: ₹" + price;


/* Scroll to Order Box */

document.getElementById("box").scrollIntoView({
behavior:"smooth"
});

}



/* PAYMENT */

function makePayment(){


let name =
document.getElementById("name").value.trim();


let uid =
document.getElementById("uid").value.trim();


/* Check Details */

if(name === "" || uid === ""){

alert("Please enter your Name and BGMI UID first.");

return;

}


/* UPI Details */

let upiID = "8279207685@apl";

let payeeName = "BGMI UC STORE";


let note =
pack + " - " +
name + " - UID " +
uid;


/* UPI Payment Link */

let upiURL =
"upi://pay" +
"?pa=" + encodeURIComponent(upiID) +
"&pn=" + encodeURIComponent(payeeName) +
"&am=" + encodeURIComponent(price) +
"&cu=INR" +
"&tn=" + encodeURIComponent(note);


/* Open Payment App */

window.location.href = upiURL;

}



/* WHATSAPP ORDER */

function sendWhatsApp(){


let name =
document.getElementById("name").value.trim();


let uid =
document.getElementById("uid").value.trim();


/* Check Details */

if(name === "" || uid === ""){

alert("Please enter your Name and BGMI UID first.");

return;

}


/* WhatsApp Message */

let message =
"BGMI UC ORDER" +
"\n\n" +
"Name: " + name +
"\n" +
"BGMI UID: " + uid +
"\n" +
"Package: " + pack +
"\n" +
"Price: ₹" + price;


/* WhatsApp Number */

let whatsappURL =
"https://wa.me/918279207685?text=" +
encodeURIComponent(message);


/* Open WhatsApp */

window.open(
whatsappURL,
"_blank"
);

}

</script>


</body>
</html>
